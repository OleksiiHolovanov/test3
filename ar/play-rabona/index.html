,.28)}.sx-small{display:block;margin-top:14px;color:#7f8aa3;font-size:.82rem}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}@media(max-width:480px){.sx-redirect-card{padding:26px 18px 22px;border-radius:18px}h1{font-size:1.35rem}}
